# Gera o app Android (TWA) do China Engine e publica na aba Releases do GitHub.
# Como usar: aba Actions → "App Android" → Run workflow → digite a versão (ex.: 1.0.0).
# Precisa de dois Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — a chave de assinatura, em base64
#   ANDROID_KEYSTORE_SENHA   — a senha da chave
# Só é preciso gerar um app novo quando mudar algo na pasta android/. Mudanças no site
# (index.html, app.js, styles.css…) aparecem no app sozinhas, sem reinstalar.
name: App Android

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão do app (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      APP_VERSAO: ${{ github.event.inputs.versao }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar a chave de assinatura
        env:
          CHAVE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          CHAVE="$RUNNER_TEMP/chave.keystore"
          if [ -z "$CHAVE_B64" ]; then echo "::error::Falta o Secret ANDROID_KEYSTORE_BASE64 (veja o topo deste arquivo)."; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_SENHA" ]; then echo "::error::Falta o Secret ANDROID_KEYSTORE_SENHA (veja o topo deste arquivo)."; exit 1; fi
          # tira espaços e quebras de linha que às vezes vêm junto ao colar
          if ! printf '%s' "$CHAVE_B64" | tr -d ' \r\n\t' | base64 -d > "$CHAVE" 2>/dev/null; then
            echo "::error::O Secret ANDROID_KEYSTORE_BASE64 não é o texto da chave (base64). Rode de novo o comando do PowerShell que copia a chave e cole no Secret sem mudar nada."; exit 1
          fi
          TAM=$(stat -c%s "$CHAVE")
          echo "Chave recebida: $TAM bytes, $(printf '%s' "$CHAVE_B64" | tr -d ' \r\n\t' | wc -c) caracteres no Secret."
          if [ "$TAM" -lt 1000 ]; then echo "::error::A chave no Secret ANDROID_KEYSTORE_BASE64 parece incompleta ($TAM bytes). Copie de novo pelo PowerShell e cole o texto inteiro."; exit 1; fi
          if ! keytool -list -keystore "$CHAVE" -storetype pkcs12 -storepass "$ANDROID_KEYSTORE_SENHA" -alias chinaengine > /dev/null 2>&1; then
            echo "::error::A senha do Secret ANDROID_KEYSTORE_SENHA não abre a chave (ou a chave não é a chave-china-engine.keystore). Confira a senha digitada no Secret."; exit 1
          fi
          echo "Chave e senha conferidas."
          echo "ANDROID_KEYSTORE=$CHAVE" >> "$GITHUB_ENV"

      - name: Gerar o APK assinado
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Arquivo de verificação do site (assetlinks.json)
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          DIGITAL=$(keytool -list -v -keystore "$ANDROID_KEYSTORE" -storetype pkcs12 -alias chinaengine -storepass "$ANDROID_KEYSTORE_SENHA" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Impressão digital SHA-256 da chave: $DIGITAL"
          cat > assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.machadocreative.chinaengine",
              "sha256_cert_fingerprints": ["$DIGITAL"]
            }
          }]
          JSON
          cp android/app/build/outputs/apk/release/app-release.apk "china-engine-${APP_VERSAO}.apk"
          rm -f "$ANDROID_KEYSTORE"

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.event.inputs.versao }}
          name: App Android ${{ github.event.inputs.versao }}
          body: |
            App Android do China Engine, versão ${{ github.event.inputs.versao }}.
            Para instalar: no celular, baixe o arquivo .apk abaixo e abra. Na primeira vez, o Android pede para
            autorizar a instalação de apps desta origem (navegador ou Arquivos).
            O assetlinks.json é o arquivo de verificação do repositório machadocreative.github.io (só muda se a chave mudar).
          files: |
            china-engine-${{ github.event.inputs.versao }}.apk
            assetlinks.json